worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  gzip            on;
  gzip_types      text/plain text/css application/json application/javascript text/xml;

  # ── Upstream definitions ─────────────────────────────────────────────────────
  upstream api_backend {
    least_conn;
    server api:3001;
    keepalive 32;
  }

  upstream ai_worker {
    server ai-worker:3002;
  }

  upstream stream_worker {
    server stream-worker:3003;
  }

  upstream minio_backend {
    server minio:9000;
  }

  # ── Rate limiting ─────────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS main server ─────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.glorycast.ai;

    ssl_certificate     /etc/letsencrypt/live/api.glorycast.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.glorycast.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 500M;

    # ── REST API ─────────────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=20 nodelay;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # ── Auth endpoints (stricter rate limit) ──────────────────────────────────
    location /api/v1/auth/ {
      limit_req zone=auth burst=5;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws/ {
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_read_timeout 3600s;
    }

    # ── HLS streaming ─────────────────────────────────────────────────────────
    location /hls/ {
      proxy_pass http://stream_worker/;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;
    }

    # ── MinIO storage ─────────────────────────────────────────────────────────
    location /storage/ {
      proxy_pass http://minio_backend/;
      proxy_set_header Host $http_host;
    }

    # ── Swagger docs ──────────────────────────────────────────────────────────
    location /api/v1/docs {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }

  # ── MinIO console ─────────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name storage.glorycast.ai;

    ssl_certificate     /etc/letsencrypt/live/api.glorycast.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.glorycast.ai/privkey.pem;

    ignore_invalid_headers off;
    client_max_body_size    0;
    proxy_buffering         off;

    location / {
      proxy_pass http://minio_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      chunked_transfer_encoding on;
    }
  }
}
