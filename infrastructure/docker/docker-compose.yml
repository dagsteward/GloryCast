version: '3.9'

# ── GloryCast AI — Development Stack ─────────────────────────────────────────
# All self-hosted, zero cloud cost.
# Usage: docker compose up -d

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: glorycast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     glorycast
      POSTGRES_PASSWORD: glorycast_dev
      POSTGRES_DB:       glorycast
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glorycast']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: glorycast-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible storage) ───────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: glorycast-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER:     glorycast
      MINIO_ROOT_PASSWORD: glorycast_minio_dev
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MinIO bucket init ────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: glorycast-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 glorycast glorycast_minio_dev;
      mc mb --ignore-existing minio/glorycast;
      mc anonymous set download minio/glorycast/public;
      exit 0;
      "

  # ── NestJS API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: glorycast-api
    restart: unless-stopped
    environment:
      NODE_ENV:            development
      DATABASE_URL:        postgresql://glorycast:glorycast_dev@postgres:5432/glorycast
      REDIS_URL:           redis://redis:6379
      JWT_SECRET:          dev-jwt-secret-change-in-prod
      JWT_REFRESH_SECRET:  dev-refresh-secret-change-in-prod
      MINIO_ENDPOINT:      minio
      MINIO_PORT:          9000
      MINIO_USE_SSL:       'false'
      MINIO_ACCESS_KEY:    glorycast
      MINIO_SECRET_KEY:    glorycast_minio_dev
      MINIO_BUCKET:        glorycast
      MINIO_PUBLIC_URL:    http://localhost:9000
      AI_SERVICE_URL:      http://ai-worker:3002
      OLLAMA_URL:          http://ollama:11434
      OLLAMA_MODEL:        mistral
      LIVEKIT_URL:         ws://livekit:7880
      LIVEKIT_API_KEY:     devkey
      LIVEKIT_API_SECRET:  devsecret
      PORT:                3001
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/backend:/app
      - /app/node_modules

  # ── AI Worker ────────────────────────────────────────────────────────────────
  ai-worker:
    build:
      context: ../../services/ai-worker
      dockerfile: Dockerfile
    container_name: glorycast-ai-worker
    restart: unless-stopped
    environment:
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      OLLAMA_URL:     http://ollama:11434
      OLLAMA_MODEL:   mistral
      WHISPER_BIN:    /usr/local/bin/whisper
      WHISPER_MODEL:  /models/ggml-base.en.bin
      PORT:           3002
    ports:
      - '3002:3002'
    depends_on:
      - redis
      - ollama
    volumes:
      - whisper_models:/models
      - /tmp/glorycast:/tmp/glorycast

  # ── Stream Worker ─────────────────────────────────────────────────────────────
  stream-worker:
    build:
      context: ../../services/stream-worker
      dockerfile: Dockerfile
    container_name: glorycast-stream-worker
    restart: unless-stopped
    environment:
      RTMP_PORT:           1935
      HLS_PORT:            8088
      LIVEKIT_URL:         ws://livekit:7880
      LIVEKIT_API_KEY:     devkey
      LIVEKIT_API_SECRET:  devsecret
      PORT:                3003
    ports:
      - '1935:1935'
      - '8088:8088'
      - '3003:3003'

  # ── Ollama (local LLM) ───────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: glorycast-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - '11434:11434'
    # Uncomment for GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── LiveKit ───────────────────────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: glorycast-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: 'devkey: devsecret'
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: glorycast-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_models:
  whisper_models:
