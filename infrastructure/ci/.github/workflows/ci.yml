name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:

  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (backend)
        run: npm ci
        working-directory: apps/backend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: apps/backend

      - name: Lint
        run: npx eslint "src/**/*.ts" --max-warnings 0
        working-directory: apps/backend

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     test
          POSTGRES_PASSWORD: test
          POSTGRES_DB:       glorycast_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/glorycast_test

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests
        working-directory: apps/backend
        env:
          DATABASE_URL:       postgresql://test:test@localhost:5432/glorycast_test
          REDIS_URL:          redis://localhost:6379
          JWT_SECRET:         test-secret
          JWT_REFRESH_SECRET: test-refresh-secret

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test-backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          push: true
          tags: |
            glorycast/api:latest
            glorycast/api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build and push AI Worker
        uses: docker/build-push-action@v5
        with:
          context: services/ai-worker
          push: true
          tags: |
            glorycast/ai-worker:latest
            glorycast/ai-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build and push Stream Worker
        uses: docker/build-push-action@v5
        with:
          context: services/stream-worker
          push: true
          tags: |
            glorycast/stream-worker:latest
            glorycast/stream-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
